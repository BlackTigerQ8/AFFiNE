name: Build & Push Custom Image

on:
  push:
    branches: ['canary']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable Corepack & Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Install Dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Build All Web Clients & Server
        run: |
          yarn affine build -p @affine/server -p @affine/web -p @affine/admin -p @affine/mobile --deps
          mkdir -p ./packages/frontend/admin/dist ./packages/frontend/apps/mobile/dist ./packages/frontend/apps/web/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/deployment/node/Dockerfile
          push: true
          tags: ghcr.io/blacktigerq8/affine:latest
